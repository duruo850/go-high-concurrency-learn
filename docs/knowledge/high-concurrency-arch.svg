<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-label="高并发精简链路">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="url(#bg)"/>
  <text x="480" y="40" text-anchor="middle" fill="#f8fafc" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">高并发精简链路（接入层已合并，避免重复）</text>
  <text x="480" y="64" text-anchor="middle" fill="#94a3b8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12">DNS → L4/L7(+TLS/限流/鉴权) → 微服务业务层 → 基础层</text>

  <!-- clients -->
  <rect x="120" y="90" width="160" height="50" rx="10" fill="#0284c7"/>
  <text x="200" y="120" text-anchor="middle" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">客户端 + 消峰</text>
  <rect x="320" y="90" width="160" height="50" rx="10" fill="#0284c7"/>
  <text x="400" y="120" text-anchor="middle" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">App / Web</text>
  <rect x="520" y="90" width="160" height="50" rx="10" fill="#0284c7"/>
  <text x="600" y="120" text-anchor="middle" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">小程序 …</text>
  <rect x="720" y="90" width="120" height="50" rx="10" fill="#0369a1"/>
  <text x="780" y="120" text-anchor="middle" fill="#e0f2fe" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13">HTTPS</text>

  <line x1="480" y1="140" x2="480" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- access merged -->
  <rect x="140" y="180" width="680" height="150" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="480" y="210" text-anchor="middle" fill="#6ee7b7" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">接入层（一层搞定，不再拆「LB + 接入网关」两层重复）</text>

  <rect x="170" y="230" width="180" height="70" rx="10" fill="#059669"/>
  <text x="260" y="260" text-anchor="middle" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">1. DNS 就近</text>
  <text x="260" y="280" text-anchor="middle" fill="#d1fae5" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11">华东多 AZ</text>

  <rect x="390" y="230" width="180" height="70" rx="10" fill="#059669"/>
  <text x="480" y="260" text-anchor="middle" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">2. L4/L7 LB</text>
  <text x="480" y="280" text-anchor="middle" fill="#d1fae5" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11">F5/SLB · TLS 卸载</text>

  <rect x="610" y="230" width="180" height="70" rx="10" fill="#10b981"/>
  <text x="700" y="255" text-anchor="middle" fill="#064e3b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">3. Nginx/网关能力</text>
  <text x="700" y="275" text-anchor="middle" fill="#064e3b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11">鉴权·路由·限流</text>

  <line x1="480" y1="330" x2="480" y2="365" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- business microservices -->
  <rect x="140" y="370" width="680" height="120" rx="14" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
  <text x="480" y="400" text-anchor="middle" fill="#ddd6fe" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">业务层（微服务架构）</text>
  <rect x="180" y="420" width="120" height="48" rx="8" fill="#7c3aed"/>
  <text x="240" y="449" text-anchor="middle" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13">用户 ×N</text>
  <rect x="320" y="420" width="120" height="48" rx="8" fill="#7c3aed"/>
  <text x="380" y="449" text-anchor="middle" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13">订单 ×N</text>
  <rect x="460" y="420" width="120" height="48" rx="8" fill="#7c3aed"/>
  <text x="520" y="449" text-anchor="middle" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13">交易 ×N</text>
  <rect x="600" y="420" width="180" height="48" rx="8" fill="#6d28d9"/>
  <text x="690" y="449" text-anchor="middle" fill="#ede9fe" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13">… MaxConns</text>

  <line x1="480" y1="490" x2="480" y2="525" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- base -->
  <rect x="140" y="530" width="680" height="90" rx="14" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="480" y="560" text-anchor="middle" fill="#ffedd5" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">基础层</text>
  <text x="480" y="590" text-anchor="middle" fill="#fed7aa" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13">MySQL · Redis · Kafka · ES · OSS · CDN</text>

  <rect x="80" y="640" width="800" height="28" rx="8" fill="#334155"/>
  <text x="480" y="659" text-anchor="middle" fill="#e2e8f0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12">完整版（含治理/运维侧栏）见 high-concurrency-full-arch.svg</text>
</svg>
