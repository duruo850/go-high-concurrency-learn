<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" width="1180" height="860" role="img" aria-label="完整高并发服务端架构">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1180" height="860" fill="url(#bg)"/>

  <text x="590" y="32" text-anchor="middle" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">完整高并发服务端架构</text>
  <text x="590" y="54" text-anchor="middle" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12">左侧主链路　｜　右侧服务治理　｜　底部运维/管理</text>

  <!-- ===== 展示层 ===== -->
  <rect x="40" y="70" width="780" height="84" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#sh)"/>
