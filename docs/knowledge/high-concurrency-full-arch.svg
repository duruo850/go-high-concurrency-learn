  <text x="90" y="208" fill="#047857" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">L4/L7 与网关同层：限流/过载拒绝适合放这；削峰填谷主要靠 MQ，不单靠接入层</text>

  <rect x="90" y="220" width="130" height="50" rx="8" fill="#d1fae5" stroke="#10b981"/>
  <text x="155" y="240" text-anchor="middle" fill="#065f46" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">DNS / 就近</text>
  <text x="155" y="258" text-anchor="middle" fill="#047857" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10">华东多 AZ</text>

  <line x1="220" y1="245" x2="248" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="220" width="150" height="50" rx="8" fill="#d1fae5" stroke="#10b981"/>
  <text x="325" y="240" text-anchor="middle" fill="#065f46" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">L4/L7 负载均衡</text>
  <text x="325" y="258" text-anchor="middle" fill="#047857" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10">F5 / SLB · TLS 卸载</text>

  <line x1="400" y1="245" x2="428" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="430" y="220" width="220" height="50" rx="8" fill="#a7f3d0" stroke="#059669"/>
  <text x="540" y="240" text-anchor="middle" fill="#065f46" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">Nginx / APISIX 网关</text>
  <text x="540" y="258" text-anchor="middle" fill="#047857" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10">认证·鉴权·路由·限流（过载拒绝）</text>

  <rect x="670" y="220" width="120" height="50" rx="8" fill="#86efac" stroke="#16a34a"/>
  <text x="730" y="240" text-anchor="middle" fill="#14532d" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">CDN</text>
  <text x="730" y="258" text-anchor="middle" fill="#166534" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10">静态/就近缓存</text>

  <rect x="90" y="284" width="700" height="52" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="440" y="305" text-anchor="middle" fill="#065f46" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">推荐链路：客户端 → CDN(静态) / DNS → L4/L7 → Nginx/APISIX → 微服务</text>
  <text x="440" y="324" text-anchor="middle" fill="#047857" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11">CDN 不替代 API 源站；动态接口仍走 LB+Nginx/APISIX</text>

  <line x1="430" y1="352" x2="430" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

