server:
  http:
    addr: 0.0.0.0:8000
    timeout: 3s

leak:
  # leak: workers allocate and retain forever (goroutine + heap grow)
  # fixed: workers allocate then release, exit after bounded work
  mode: leak
  workers: 8
  chunk_bytes: 65536
  interval: 200ms

# JSONL for Filebeat → Elasticsearch (ELK plan)
log:
  path: tmp/logs/app.jsonl

# Leave empty for local runs without Sentry; or set SENTRY_DSN env (overrides).
sentry:
  dsn: ""
  environment: local
  debug: false

# OpenTelemetry → OTLP/HTTP (Jaeger all-in-one :4318). Empty = disabled.
# Env OTEL_EXPORTER_OTLP_ENDPOINT overrides. make jaeger-up 后可改为 http://127.0.0.1:4318
trace:
  endpoint: ""
  sample_ratio: 1.0
